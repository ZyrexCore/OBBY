name: Apply Portfolio Theme

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  theme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply black and white modern theme
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
            '--bg:#05070d;--bg2:#080c15;--panel:rgba(12,18,31,.72);--line:rgba(140,170,220,.16);--text:#f4f7ff;--muted:#8d9ab2;--accent:#72e6ff;--accent2:#9b7bff;': '--bg:#050505;--bg2:#0b0b0b;--panel:rgba(18,18,18,.78);--line:rgba(255,255,255,.13);--text:#f5f5f5;--muted:#999;--accent:#fff;--accent2:#d0d0d0;',
            'background:radial-gradient(circle at 15% 5%,rgba(114,230,255,.1),transparent 25rem),radial-gradient(circle at 85% 20%,rgba(155,123,255,.11),transparent 28rem),linear-gradient(135deg,var(--bg),var(--bg2) 55%,#05070d);': 'background:linear-gradient(145deg,var(--bg),var(--bg2) 55%,#050505);',
            'width:420px;height:420px;': 'width:260px;height:260px;',
            'background:radial-gradient(circle,rgba(114,230,255,.075),transparent 65%);': 'background:radial-gradient(circle,rgba(255,255,255,.035),transparent 68%);',
            'background:rgba(5,7,13,.68);': 'background:rgba(8,8,8,.82);',
            'box-shadow:0 0 15px var(--accent);': 'box-shadow:0 0 8px rgba(255,255,255,.35);',
            'box-shadow:0 0 22px var(--accent);': 'box-shadow:0 0 10px rgba(255,255,255,.25);',
            'border-color:rgba(114,230,255,.45);': 'border-color:rgba(255,255,255,.32);',
            'color:#061017;background:var(--accent);border-color:var(--accent);box-shadow:0 0 35px rgba(114,230,255,.18)': 'color:#050505;background:#fff;border-color:#fff;box-shadow:0 0 24px rgba(255,255,255,.10)',
            'box-shadow:0 0 45px rgba(114,230,255,.32)': 'box-shadow:0 0 30px rgba(255,255,255,.16)',
            'background:#070a11;': 'background:#0a0a0a;',
            'border-color:rgba(114,230,255,.35);': 'border-color:rgba(255,255,255,.25);',
            'rgba(140,170,220,.25)': 'rgba(255,255,255,.18)',
            'border-top-color:var(--accent)': 'border-top-color:#fff',
            'font-size:clamp(48px,9vw,105px);': 'font-size:clamp(46px,8vw,92px);',
            'border-radius:22px;': 'border-radius:16px;'
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

      - name: Commit theme
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Update portfolio to monochrome modern theme"
          git push

      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/apply-theme.yml
          git commit -m "Remove temporary theme workflow"
          git push
