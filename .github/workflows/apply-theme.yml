name: Apply Portfolio Theme

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - '.github/workflows/apply-theme.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  theme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix portfolio theme and static asset loading
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          replacements = {
            '--bg:#05070d;--bg2:#080c15;--panel:rgba(12,18,31,.72);--line:rgba(140,170,220,.16);--text:#f4f7ff;--muted:#8d9ab2;--accent:#72e6ff;--accent2:#9b7bff;': '--bg:#050505;--bg2:#0b0b0b;--panel:rgba(18,18,18,.78);--line:rgba(255,255,255,.13);--text:#f5f5f5;--muted:#999;--accent:#fff;--accent2:#d0d0d0;',
            'background:radial-gradient(circle at 15% 5%,rgba(114,230,255,.1),transparent 25rem),radial-gradient(circle at 85% 20%,rgba(155,123,255,.11),transparent 28rem),linear-gradient(135deg,var(--bg),var(--bg2) 55%,#05070d);': 'background:linear-gradient(145deg,var(--bg),var(--bg2) 55%,#050505);',
            'width:420px;height:420px;': 'width:220px;height:220px;',
            'background:radial-gradient(circle,rgba(114,230,255,.075),transparent 65%);': 'background:radial-gradient(circle,rgba(255,255,255,.028),transparent 68%);',
            'background:rgba(5,7,13,.68);': 'background:rgba(8,8,8,.82);',
            'box-shadow:0 0 15px var(--accent);': 'box-shadow:0 0 7px rgba(255,255,255,.30);',
            'box-shadow:0 0 22px var(--accent);': 'box-shadow:0 0 9px rgba(255,255,255,.22);',
            'border-color:rgba(114,230,255,.45);': 'border-color:rgba(255,255,255,.30);',
            'color:#061017;background:var(--accent);border-color:var(--accent);box-shadow:0 0 35px rgba(114,230,255,.18)': 'color:#050505;background:#fff;border-color:#fff;box-shadow:0 0 22px rgba(255,255,255,.09)',
            'box-shadow:0 0 45px rgba(114,230,255,.32)': 'box-shadow:0 0 28px rgba(255,255,255,.14)',
            'background:#070a11;': 'background:#0a0a0a;',
            'border-color:rgba(114,230,255,.35);': 'border-color:rgba(255,255,255,.23);',
            'rgba(140,170,220,.25)': 'rgba(255,255,255,.17)',
            'border-top-color:var(--accent)': 'border-top-color:#fff',
            'font-size:clamp(48px,9vw,105px);': 'font-size:clamp(46px,8vw,92px);',
            'border-radius:22px;': 'border-radius:16px;'
          }

          for old, new in replacements.items():
              s = s.replace(old, new)

          start = s.find('async function loadPortfolio()')
          end = s.find('\nfunction openLightbox', start)
          if start != -1 and end != -1:
              new_loader = '''async function loadPortfolio(){
  const gamesGrid=document.getElementById("gamesGrid");
  const gfxGrid=document.getElementById("gfxGrid");
  const modelsGrid=document.getElementById("modelsGrid");
  try{
    const response=await fetch(`portfolio-manifest.json?v=${Date.now()}`,{cache:"no-store"});
    if(!response.ok) throw new Error(`Portfolio manifest returned ${response.status}`);
    const items=await response.json();
    const asset=item=>`assets/${encodeURIComponent(item.file)}`;
    const games=items.filter(x=>x.type==="game").sort(sortByNumber);
    const gfx=items.filter(x=>x.type==="gfx").sort(sortByNumber);
    const models=items.filter(x=>x.type==="model").sort(sortByNumber);
    document.getElementById("gameCount").textContent=games.length;
    document.getElementById("gfxCount").textContent=gfx.length;
    document.getElementById("modelCount").textContent=models.length;
    gamesGrid.innerHTML=games.length?games.map(item=>{
      const link=CONFIG.GAME_LINKS[String(item.number)]||"#";
      const button=link==="#"?`<span class="btn" style="opacity:.55;cursor:not-allowed">Play Link Not Set</span>`:`<a class="btn primary" href="${escapeHTML(link)}" target="_blank" rel="noopener">▶ Play Game</a>`;
      return `<article class="card reveal"><div class="card-media"><img src="${asset(item)}" alt="${escapeHTML(item.title)}" loading="lazy" decoding="async"></div><div class="card-body"><div class="card-kicker">ROBLOX GAME</div><h3>${escapeHTML(item.title)}</h3><p>Roblox experience by ZyrexCore.</p><div class="card-actions">${button}</div></div></article>`;
    }).join(""):emptyMessage("games","Game1.png");
    gfxGrid.innerHTML=gfx.length?gfx.map(item=>makeGalleryCard({...item,path:`assets/${item.file}`},"GFX")).join(""):emptyMessage("GFX works","GFX1.png");
    modelsGrid.innerHTML=models.length?models.map(item=>makeGalleryCard({...item,path:`assets/${item.file}`},"3D MODEL",true)).join(""):emptyMessage("3D models","Model1.png");
    activateReveal();
  }catch(error){
    showError(gamesGrid,error.message);
    showError(gfxGrid,error.message);
    showError(modelsGrid,error.message);
  }
}'''
              s = s[:start] + new_loader + s[end:]

          p.write_text(s, encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix portfolio loading and monochrome theme"
          git push
