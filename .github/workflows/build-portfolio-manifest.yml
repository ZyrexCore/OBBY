name: Build Portfolio Manifest

on:
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'game-links.json'
      - '.github/workflows/build-portfolio-manifest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate manifest
        shell: python
        run: |
          import json, re
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          assets = Path('assets')
          entries = []
          pattern = re.compile(r'^(gfx|graphic|graphics|model|models)[ _-]*(\d+)\.(png|jpe?g|webp|gif|avif)$', re.I)
          links = json.loads(Path('game-links.json').read_text(encoding='utf-8')) if Path('game-links.json').exists() else {}

          def get_json(url):
              req = Request(url, headers={'User-Agent': 'ZyrexCore-Portfolio/1.0'})
              with urlopen(req, timeout=20) as response:
                  return json.loads(response.read().decode('utf-8'))

          def roblox_game(place_id):
              if not place_id:
                  return None
              try:
                  u = get_json(f'https://apis.roblox.com/universes/v1/places/{place_id}/universe')
                  uid = u.get('universeId')
                  if not uid:
                      return None
                  data = get_json(f'https://games.roblox.com/v1/games?universeIds={uid}')
                  game = (data.get('data') or [None])[0]
                  if not game:
                      return None
                  q = urlencode({'universeIds': uid, 'countPerUniverse': 10, 'defaults': 'true', 'size': '768x432', 'format': 'Png', 'isCircular': 'false'})
                  thumbs_data = get_json(f'https://thumbnails.roblox.com/v1/games/multiget/thumbnails?{q}')
                  thumbs=[]
                  for row in thumbs_data.get('data', []):
                      for t in row.get('thumbnails', []):
                          image=t.get('imageUrl')
                          if image and image not in thumbs: thumbs.append(image)
                  return {'universeId':uid,'title':game.get('name') or '', 'description':game.get('description') or '', 'thumbnails':thumbs}
              except Exception as exc:
                  print(f'Roblox lookup failed for {place_id}: {exc}')
                  return None

          # Every non-empty link becomes a game. Empty links remain as a pending card.
          for key, url in sorted(links.items(), key=lambda x:int(x[0])):
              number=int(key)
              url=(url or '').strip()
              match=re.search(r'/games/(\d+)', url)
              place_id=match.group(1) if match else ''
              entry={'type':'game','number':number,'title':f'Game {number}','url':url or '#','placeId':place_id,'description':'','thumbnails':[]}
              meta=roblox_game(place_id)
              if meta: entry.update(meta)
              entries.append(entry)

          # GFX and 3D models remain local numbered assets.
          for p in sorted(assets.iterdir(), key=lambda x:x.name.lower()):
              if not p.is_file(): continue
              m=pattern.match(p.name)
              if not m: continue
              prefix,number,_=m.groups(); number=int(number)
              typ='gfx' if prefix.lower().startswith(('gfx','graphic')) else 'model'
              entries.append({'type':typ,'number':number,'title':f'{"GFX" if typ=="gfx" else "Model"} {number}','file':p.name})

          entries.sort(key=lambda x:(x['type'],x['number']))
          Path('portfolio-manifest.json').write_text(json.dumps(entries,indent=2,ensure_ascii=False),encoding='utf-8')

      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio-manifest.json
          git diff --cached --quiet || git commit -m "Update portfolio asset manifest"
          git push
