name: Build Portfolio Manifest

on:
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - '.github/workflows/build-portfolio-manifest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate manifest from portfolio assets and Roblox links
        shell: python
        run: |
          import json, re
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          assets = Path('assets')
          entries = []
          pattern = re.compile(r'^(gfx|graphic|graphics|model|models)[ _-]*(\d+)\.(png|jpe?g|webp|gif|avif)$', re.I)

          # Add Roblox game links here. The site will automatically fetch the
          # Roblox name, description and experience thumbnails from each link.
          game_config = {
              1: {'placeId': '138590507775487', 'url': 'https://www.roblox.com/games/138590507775487/High-Cortisol-Obby'},
              2: {'placeId': '113850844866673', 'url': 'https://www.roblox.com/games/113850844866673/OBBY-BUT-YOU-ARE-WITH-CLONES'},
              3: {'placeId': '', 'url': '#'}
          }

          def get_json(url):
              req = Request(url, headers={'User-Agent': 'ZyrexCore-Portfolio/1.0'})
              with urlopen(req, timeout=20) as response:
                  return json.loads(response.read().decode('utf-8'))

          def roblox_game(place_id):
              if not place_id:
                  return None
              try:
                  u = get_json(f'https://apis.roblox.com/universes/v1/places/{place_id}/universe')
                  uid = u.get('universeId')
                  if not uid:
                      return None
                  data = get_json(f'https://games.roblox.com/v1/games?universeIds={uid}')
                  game = (data.get('data') or [None])[0]
                  if not game:
                      return None
                  thumbs_url = 'https://thumbnails.roblox.com/v1/games/multiget/thumbnails?' + urlencode({
                      'universeIds': uid,
                      'countPerUniverse': 10,
                      'defaults': 'true',
                      'size': '768x432',
                      'format': 'Png',
                      'isCircular': 'false'
                  })
                  thumbs_data = get_json(thumbs_url)
                  thumbs = []
                  for row in thumbs_data.get('data', []):
                      for t in row.get('thumbnails', []):
                          image = t.get('imageUrl')
                          if image and image not in thumbs:
                              thumbs.append(image)
                  return {
                      'universeId': uid,
                      'name': game.get('name') or '',
                      'description': game.get('description') or '',
                      'thumbnails': thumbs
                  }
              except Exception as exc:
                  print(f'Roblox lookup failed for {place_id}: {exc}')
                  return None

          # Games come ONLY from the links above; no game1.png/game2.png files needed.
          for number, cfg in sorted(game_config.items()):
              entry = {
                  'type': 'game',
                  'number': number,
                  'title': f'Game {number}',
                  'url': cfg.get('url', '#'),
                  'placeId': cfg.get('placeId', ''),
                  'description': '',
                  'thumbnails': []
              }
              meta = roblox_game(entry['placeId'])
              if meta:
                  entry.update(meta)
              entries.append(entry)

          # GFX and models still use numbered local assets.
          for p in sorted(assets.iterdir(), key=lambda x: x.name.lower()):
              if not p.is_file():
                  continue
              m = pattern.match(p.name)
              if not m:
                  continue
              prefix, number, ext = m.groups()
              typ = 'gfx' if prefix.lower().startswith(('gfx','graphic')) else 'model'
              number = int(number)
              entries.append({
                  'type': typ,
                  'number': number,
                  'title': f'{"GFX" if typ == "gfx" else "Model"} {number}',
                  'file': p.name
              })

          entries.sort(key=lambda x: (x['type'], x['number']))
          Path('portfolio-manifest.json').write_text(json.dumps(entries, indent=2, ensure_ascii=False), encoding='utf-8')

      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio-manifest.json
          git diff --cached --quiet || git commit -m "Update portfolio asset manifest"
          git push
