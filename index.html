<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zyrex Studios</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #0b0b0f;
        }

        .game {
            width: min(90%, 800px);
            cursor: pointer;

            border-radius: 20px;
            overflow: hidden;

            transition: 0.2s ease;
        }

        .game:hover {
            transform: scale(1.03);
        }

        .game:active {
            transform: scale(0.98);
        }

        .game img {
            width: 100%;
            display: block;
        }
    </style>
</head>

<body>

    <a
        class="game"
        href="https://www.roblox.com/games/113850844866673/OBBY-BUT-YOU-ARE-WITH-CLONES"
        target="_blank"
    >
        <img src="noFilter.png" alt="Play Roblox Game">
    </a>

</body>
</html>
